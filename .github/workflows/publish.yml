name: Publish Kotlin Multiplatform to GitHub Packages

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'air-tv/video' && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ github.event.release.tag_name }}" }
      - id: version
        run: ./scripts/validate-release-version.sh "${{ github.event.release.tag_name }}"

  verify-linux:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ github.event.release.tag_name }}" }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: ./scripts/test-release-package-preflight.sh
      - run: ./gradlew jvmTest jsNodeTest wasmJsNodeTest testReleaseUnitTest compileReleaseKotlinAndroid linuxX64Test --max-workers=2

  verify-apple:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ github.event.release.tag_name }}" }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: "17" }
      - run: >-
          ./gradlew macosX64Test compileKotlinMacosArm64 compileKotlinIosX64
          compileKotlinIosArm64 compileKotlinIosSimulatorArm64 --max-workers=2

  verify-windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ github.event.release.tag_name }}" }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: "17" }
      - run: ./gradlew mingwX64Test --max-workers=2
        shell: bash

  preflight-packages:
    needs: [validate, verify-linux, verify-apple, verify-windows]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ github.event.release.tag_name }}" }
      - name: Refuse an existing KMP Maven version before any write
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: ./scripts/assert-release-package-version-available.sh "$RELEASE_VERSION"

  publish-linux:
    needs: [validate, verify-linux, verify-apple, verify-windows, preflight-packages]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    env: { AIR_RELEASE_VERSION: "${{ needs.validate.outputs.version }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ github.event.release.tag_name }}" }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Publish Android, JVM, web, and Linux targets
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: >-
          ./gradlew publishAndroidReleasePublicationToGitHubPackagesRepository
          publishJvmPublicationToGitHubPackagesRepository publishJsPublicationToGitHubPackagesRepository
          publishWasmJsPublicationToGitHubPackagesRepository publishLinuxX64PublicationToGitHubPackagesRepository
          -PVERSION_NAME=${{ needs.validate.outputs.version }} --max-workers=2

  publish-apple:
    needs: [validate, publish-linux]
    runs-on: macos-latest
    permissions: { contents: read, packages: write }
    env: { AIR_RELEASE_VERSION: "${{ needs.validate.outputs.version }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ github.event.release.tag_name }}" }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: "17" }
      - name: Publish Apple targets
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: >-
          ./gradlew publishMacosX64PublicationToGitHubPackagesRepository
          publishMacosArm64PublicationToGitHubPackagesRepository publishIosX64PublicationToGitHubPackagesRepository
          publishIosArm64PublicationToGitHubPackagesRepository publishIosSimulatorArm64PublicationToGitHubPackagesRepository
          -PVERSION_NAME=${{ needs.validate.outputs.version }} --max-workers=2

  publish-windows:
    needs: [validate, publish-apple]
    runs-on: windows-latest
    permissions: { contents: read, packages: write }
    env: { AIR_RELEASE_VERSION: "${{ needs.validate.outputs.version }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ github.event.release.tag_name }}" }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: "17" }
      - name: Publish Windows target
        shell: bash
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: >-
          ./gradlew publishMingwX64PublicationToGitHubPackagesRepository
          -PVERSION_NAME=${{ needs.validate.outputs.version }} --max-workers=2

  root-metadata:
    needs: [validate, publish-windows]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    env: { AIR_RELEASE_VERSION: "${{ needs.validate.outputs.version }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ github.event.release.tag_name }}" }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: "17" }
      - name: Publish root KMP metadata last
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: >-
          ./gradlew publishKotlinMultiplatformPublicationToGitHubPackagesRepository
          -PVERSION_NAME=${{ needs.validate.outputs.version }} --max-workers=2

  recover-partial-release:
    needs: [validate, verify-linux, verify-apple, verify-windows, preflight-packages, publish-linux, publish-apple, publish-windows, root-metadata]
    if: >-
      ${{ always() && needs.validate.result == 'success' &&
          (needs.publish-linux.result == 'failure' || needs.publish-linux.result == 'cancelled' ||
           needs.publish-apple.result == 'failure' || needs.publish-apple.result == 'cancelled' ||
           needs.publish-windows.result == 'failure' || needs.publish-windows.result == 'cancelled' ||
           needs.root-metadata.result == 'failure' || needs.root-metadata.result == 'cancelled' ||
           (needs.publish-linux.result == 'success' && needs.root-metadata.result != 'success')) }}
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ github.event.release.tag_name }}" }
      - name: Remove every partial KMP Maven version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: ./scripts/cleanup-maven-release.sh "$RELEASE_VERSION"
