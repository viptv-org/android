name: Build Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Release tags set development builds' versionCode (VERSIONING.md).
          fetch-depth: 0
      - name: Release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Release tags must be vMAJOR.MINOR.PATCH"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || { echo "Release tags must point at a commit on main"; exit 1; }
          echo "VIPTV_VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v4.0.4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Native toolchain
        run: |
          sdkmanager 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version 4.1.2 --locked
      - run: scripts/prepare-core.sh host
      - run: ./gradlew --no-daemon :testDebugUnitTest :app:testDebugUnitTest
      - run: scripts/prepare-core.sh android
      - run: ./gradlew --no-daemon ${VIPTV_VERSION:+-PviptvVersion=$VIPTV_VERSION} :app:assemblePerformance :app:lintPerformance
      - run: python3 scripts/check-native-torrent-apk.py app/build/outputs/apk/performance/app-performance.apk
      - run: python3 scripts/check-ffmpeg-audio.py app/build/outputs/apk/performance/app-performance.apk
      - name: Package universal phone and TV APK
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          export AAPT2="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          python3 scripts/package-apk.py app/build/outputs/apk/performance/app-performance.apk artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: android-phone-tv-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-phone-tv-${{ github.sha }}
          path: artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "VIPTV Android ${GITHUB_REF_NAME#v}" --generate-notes \
            --notes "Beta build for phones, Android TV and Fire TV. Update your VIPTV backend to the latest version together with this release."
