name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v4.0.4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Native toolchain
        run: |
          sdkmanager 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version 4.1.2 --locked
      - run: scripts/prepare-core.sh host
      - run: ./gradlew --no-daemon :testDebugUnitTest :app:testDebugUnitTest
      - run: scripts/prepare-core.sh android
      - run: ./gradlew --no-daemon :app:assemblePerformance :app:lintPerformance
      - run: python3 scripts/check-native-torrent-apk.py app/build/outputs/apk/performance/app-performance.apk
      - run: python3 scripts/check-ffmpeg-audio.py app/build/outputs/apk/performance/app-performance.apk
      - name: Package universal phone and TV APK
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil,zipfile
          source=pathlib.Path('app/build/outputs/apk/performance/app-performance.apk')
          with zipfile.ZipFile(source) as archive:
              names=archive.namelist()
              assert not any('viptv_fixture_ca' in n for n in names), 'Fixture trust must not ship'
              for abi in ['arm64-v8a','armeabi-v7a','x86_64']:
                  assert f'lib/{abi}/libviptv_core.so' in names, f'Missing native core: {abi}'
          output=pathlib.Path('artifacts');output.mkdir(exist_ok=True)
          apk=output/f'viptv-android-phone-tv-development-{os.environ["BUILD_SHA"][:8]}.apk';shutil.copy2(source,apk)
          (output/'SHA256SUMS').write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+'  '+apk.name+'\n')
          (output/'build.json').write_text(json.dumps({'revision':os.environ['BUILD_SHA'],'design':pathlib.Path('DESIGN_REF').read_text().strip(),'core':pathlib.Path('CORE_REF').read_text().strip(),'torrent_runtime':pathlib.Path('TORRENT_RUNTIME_REF').read_text().strip(),'torrent_comparison_packaged':False,'native_torrent_qualified':False,'signing':'stable development key','variant':'performance','debuggable':False,'optimized':True,'platforms':['phone','android-tv']}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: android-phone-tv-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
