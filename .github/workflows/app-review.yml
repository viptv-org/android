name: Android app review

on:
  workflow_dispatch:

concurrency:
  group: android-app-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Unit policy and debug APK
        run: ./gradlew --no-daemon --max-workers=1 :app:testDebugUnitTest :app:assembleDebug
