[package]
name = "viptv-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
typegen = ["facet_typegen"]
facet_typegen = ["crux_core/facet_typegen", "crux_http/facet_typegen"]
native = ["dep:uniffi"]
provider = ["dep:viptv-provider"]
bindgen = ["native", "uniffi/cli"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
regex = "1"
crux_core.workspace = true
crux_http.workspace = true
facet.workspace = true
serde.workspace = true
serde_json.workspace = true
url = "2"
thiserror = "2"
uniffi = { version = "0.29.4", optional = true }
viptv-provider = { path = "../viptv-provider", optional = true, features = ["discovery", "extras", "candidate"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[[bin]]
name = "viptv-uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]
